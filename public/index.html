<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Discord · Friend ID Call</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div class="brand neon-glow-green">Cyber Discord</div>
        <div class="topbar-actions">
          <button id="enableNotificationsBtn" class="btn btn-ghost hidden" type="button">Enable notifications</button>
          <button id="logoutBtn" class="btn btn-ghost hidden">Logout</button>
        </div>
      </div>

      <div id="authView" class="card hidden">
        <div class="tabs">
          <button class="tab active" data-tab="login">Login</button>
          <button class="tab" data-tab="signup">Sign up</button>
        </div>

        <div id="loginTab" class="tab-panel">
          <h2>Login</h2>
          <form id="loginForm" class="form">
            <label>Email</label>
            <input name="email" type="email" autocomplete="email" required />
            <label>Parolă</label>
            <input name="password" type="password" autocomplete="current-password" required />
            <button class="btn" type="submit">Intră</button>
            <div class="hint" id="loginMsg"></div>
          </form>
        </div>

        <div id="signupTab" class="tab-panel hidden">
          <h2>Sign up</h2>
          <form id="signupForm" class="form">
            <label>Nume (opțional)</label>
            <input name="displayName" type="text" autocomplete="nickname" maxlength="40" placeholder="ex: Andrei" />
            <label>Avatar URL (opțional)</label>
            <input name="avatarUrl" type="url" autocomplete="url" maxlength="500" placeholder="https://..." />
            <label>Email</label>
            <input name="email" type="email" autocomplete="email" required />
            <label>Parolă (minim 6)</label>
            <input name="password" type="password" autocomplete="new-password" minlength="6" required />
            <button class="btn" type="submit">Creează cont</button>
            <div class="hint" id="signupMsg"></div>
          </form>
        </div>
      </div>

      <div id="appView" class="hidden">
        <div class="app-frame">
          <aside class="server-rail">
            <button id="openServerModalBtn" class="server-plus" type="button" title="Add server">+</button>
            <div id="serverIcons" class="server-icons"></div>
          </aside>

          <div id="serverModal" class="modal hidden">
            <div class="modal-card">
              <h3>Add server</h3>
              <form id="createGroupForm" class="form">
                <label>Create server</label>
                <input name="groupName" autocomplete="off" placeholder="Server name" required />
                <button class="btn" type="submit">Create</button>
              </form>
              <form id="joinGroupForm" class="form">
                <label>Join server by ID</label>
                <input name="groupCode" inputmode="numeric" autocomplete="off" placeholder="ID 10-15 digits" required />
                <button class="btn btn-ghost" type="submit">Join</button>
              </form>
              <div class="hint" id="groupMsg"></div>
              <button id="closeServerModalBtn" class="btn btn-ghost" type="button">Close</button>
            </div>
          </div>

          <div class="app-shell">
          <aside class="sidebar">
            <div class="me-card">
              <button id="avatarBtn" class="avatar" title="Profil">
                <img id="avatarImg" class="avatar-img hidden" alt="avatar" />
                <span id="avatarText">?</span>
              </button>
              <div class="me-meta">
                <div id="meName" class="profile-name"></div>
                <div id="mePublicId" class="mono muted"></div>
                <div id="meEmail" class="mono muted hidden"></div>
              </div>
              <button id="openSettingsBtn" class="btn btn-ghost btn-icon" type="button" title="Setări">⚙</button>
            </div>

            <div class="sidebar-section">
              <div class="sidebar-title muted">Adaugă prieten (ID)</div>
              <form id="addFriendForm" class="form-inline">
                <input name="friendPublicId" inputmode="numeric" autocomplete="off" placeholder="ID" required />
                <button class="btn" type="submit">+</button>
              </form>
              <div class="hint" id="addFriendMsg"></div>
            </div>

            <div class="sidebar-section">
              <div class="sidebar-title muted">Prieteni</div>
              <div id="friendsList" class="friends"></div>
            </div>

          </aside>

          <main class="main">
            <div class="main-header">
              <div class="main-title mono" id="mainTitle">Selectează un prieten</div>
              <div class="main-actions">
                <button id="serverCallBtn" class="tab2 hidden" type="button">Server Call</button>
                <button id="mainChatTab" class="tab2 active" type="button">Chat</button>
                <button id="mainCallTab" class="tab2" type="button">Apel</button>
                <button id="mainSettingsTab" class="tab2" type="button">Setări</button>
              </div>
            </div>

            <section id="chatPanel" class="panel">
              <div id="incomingCallBanner" class="incoming-call hidden neon-border-green">
                <div class="wave-bars" aria-hidden="true">
                  <span class="wave-bar"></span>
                  <span class="wave-bar"></span>
                  <span class="wave-bar"></span>
                  <span class="wave-bar"></span>
                  <span class="wave-bar"></span>
                </div>
                <div id="incomingCallText" class="incoming-title mono neon-glow-green">Incoming call</div>
                <div class="incoming-actions">
                  <div class="incoming-accept-wrap">
                    <button id="chatAcceptBtn" class="button-accept" type="button">RĂSPUNDE</button>
                  </div>
                  <button id="chatDeclineBtn" class="btn incoming-decline" type="button">Respinge</button>
                </div>
              </div>
              <div class="empty-state" id="chatEmpty">Alege un prieten din stânga ca să deschizi chat-ul.</div>
              <div id="chatWrap" class="hidden">
                <div class="call-row">
                  <div class="muted">Cu:</div>
                  <div id="chatWith" class="mono">-</div>
                </div>
                <div id="chatMessages" class="chat"></div>
                <form id="chatForm" class="form-inline chat-form">
                  <input id="chatInput" name="body" placeholder="Scrie mesaj..." autocomplete="off" />
                  <button class="btn" type="submit">Trimite</button>
                </form>
                <div class="hint" id="chatMsg"></div>
              </div>
            </section>

            <section id="callPanel" class="panel hidden">
              <div class="call-top call-top-voice">
                <div class="call-top-meta">
                  <div class="call-row">
                    <div class="muted">Status:</div>
                    <div id="callStatus" class="mono">idle</div>
                  </div>
                  <div class="call-row">
                    <div class="muted">Durată:</div>
                    <div id="callDuration" class="mono">00:00</div>
                  </div>
                </div>
                <div class="wave-bars" id="callWaveBars" aria-hidden="true">
                  <span class="wave-bar"></span>
                  <span class="wave-bar"></span>
                  <span class="wave-bar"></span>
                  <span class="wave-bar"></span>
                  <span class="wave-bar"></span>
                </div>
              </div>
              <div class="call-actions">
                <button id="hangupBtn" class="btn btn-danger hidden">Închide</button>
              </div>
              <div class="call-panel-accept">
                <button id="acceptBtn" class="button-accept hidden" type="button">ACCEPTĂ</button>
              </div>
              <div class="call-actions">
                <button id="declineBtn" class="btn btn-ghost hidden">Respinge</button>
              </div>
              <div class="call-controls">
                <button id="micMuteBtn" class="btn btn-ghost" type="button">Mute microfon</button>
                <button id="remoteMuteBtn" class="btn btn-ghost" type="button">Mute audio</button>
                <div class="volume">
                  <label for="remoteVolume" class="muted">Îl auzi</label>
                  <input id="remoteVolume" type="range" min="0" max="200" step="1" value="100" />
                  <div id="remoteVolumeLabel" class="mono muted">100%</div>
                </div>
                <div class="volume">
                  <label for="micVolume" class="muted">Te aude</label>
                  <input id="micVolume" type="range" min="0" max="200" step="1" value="100" />
                  <div id="micVolumeLabel" class="mono muted">100%</div>
                </div>
              </div>
              <div class="hint" id="callMsg"></div>
              <audio id="remoteAudio" autoplay></audio>
            </section>

            <section id="settingsPanel" class="panel hidden">
              <div class="settings-grid">
                <div class="card inner-card">
                  <h3>Profil</h3>
                  <form id="settingsForm" class="form">
                    <label>Nume</label>
                    <input name="displayName" id="settingsDisplayName" maxlength="40" placeholder="Numele tău" />
                    <label>Avatar URL</label>
                    <input name="avatarUrl" id="settingsAvatarUrl" maxlength="500" placeholder="https://..." />
                    <button class="btn" type="submit">Salvează</button>
                    <div class="hint" id="settingsMsg"></div>
                  </form>
                </div>

                <div class="card inner-card">
                  <h3>Cont</h3>
                  <div class="pill">
                    <span class="muted">ID-ul tău</span>
                    <span id="meIdPill" class="mono"></span>
                  </div>
                  <div class="pill">
                    <span class="muted">Email (doar tu)</span>
                    <span id="meEmailPill" class="mono"></span>
                  </div>
                </div>
              </div>
            </section>
          </main>
          <div id="serverSettingsModal" class="modal hidden">
            <div class="modal-card">
              <h3>Server settings</h3>
              <div class="pill">
                <span class="muted">Server ID</span>
                <span id="serverSettingsId" class="mono"></span>
              </div>
              <form id="serverSettingsForm" class="form">
                <label>Server name</label>
                <input id="serverSettingsName" name="name" maxlength="80" required />
                <label>Server avatar URL</label>
                <input id="serverSettingsAvatarUrl" name="avatarUrl" maxlength="500" placeholder="https://..." />
                <button class="btn" type="submit">Save server</button>
              </form>
              <button id="resetServerIdBtn" class="btn btn-danger" type="button">Reset ID (kick all non-owner)</button>
              <div class="hint" id="serverSettingsMsg"></div>
              <button id="closeServerSettingsBtn" class="btn btn-ghost" type="button">Close</button>
            </div>
          </div>
        </div>
        </div>
      </div>
    </div>

    <div class="madeBy">TAKEINFO · CYBER DISCORD</div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
